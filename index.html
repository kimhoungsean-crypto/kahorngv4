<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahorng</title>
<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahorng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0a1120;
}
iframe{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#0a1120;
}
</style>
</head>
<body>
<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbwm6A-pXadfGGWR3fSYg3jNMyG9nBLhIpAbCVM5x1iSLZ26Dv9ohrDPjYW8jyXiGOZB/exec"
  allow="clipboard-write">
</iframe>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
}
// ---- Session-token bridge (see JavaScript.html: "WRAPPER BRIDGE") ----
var TOKEN_KEY = 'kahorng_session_token';
var appFrame = document.getElementById('app-frame');

// TEMPORARY DIAGNOSTIC — mirrors every step here into the same on-screen
// panel the iframe side already shows (this page itself is fully covered
// by the iframe, so there's no other way to see what's happening on this
// side without this). '*' is fine — appFrame.contentWindow is a direct
// reference to our own iframe, not a broadcast to unknown parties.
function wdebug(msg) {
    try { appFrame.contentWindow.postMessage({ source: 'kahorng-wrapper', type: 'debug', msg: msg }, '*'); } catch (err) { /* iframe not ready yet, or gone */ }
}

window.addEventListener('message', function (e) {
    wdebug('listener fired — source===appFrame.contentWindow? ' + (e.source === appFrame.contentWindow) + ', data=' + JSON.stringify(e.data));

    if (e.source !== appFrame.contentWindow) return; // must be our own iframe, not some other frame
    if (!e.data || e.data.source !== 'kahorng-app') return;

    if (e.data.type === 'ready') {
        var token = null;
        try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY); } catch (err) { wdebug('reading storage THREW: ' + err.message); }
        wdebug('replying to ready — token ' + (token ? 'present' : 'null'));
        appFrame.contentWindow.postMessage({ source: 'kahorng-wrapper', type: 'token', token: token }, '*');
    } else if (e.data.type === 'token-changed') {
        try {
            if (e.data.token) {
                if (e.data.remember) { localStorage.setItem(TOKEN_KEY, e.data.token); sessionStorage.removeItem(TOKEN_KEY); }
                else { sessionStorage.setItem(TOKEN_KEY, e.data.token); localStorage.removeItem(TOKEN_KEY); }
            } else {
                localStorage.removeItem(TOKEN_KEY);
                sessionStorage.removeItem(TOKEN_KEY);
            }
            wdebug('token-changed handled, stored ' + (e.data.token ? 'present' : 'null'));
        } catch (err) { wdebug('storing token THREW: ' + err.message); }
    }
});
</script>
</body>
</html>
