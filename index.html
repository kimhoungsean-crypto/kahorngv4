<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahorng</title>
<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahorng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging-compat.js"></script>
<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0a1120;
}
iframe{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#0a1120;
}
/* Real, top-level, directly-clickable element — required so
   Notification.requestPermission() below is called synchronously inside
   a genuine user gesture. A button relayed via postMessage from the
   iframe does NOT count as a user gesture in this frame (this is why an
   earlier version silently failed on iOS specifically), so this can't be
   moved into the app's own UI — it has to be a real element the person
   taps right here. Hidden once permission is granted or denied; also
   hidden if Notification isn't supported at all.

   Smaller and softer than the original design (44px, muted gold, lighter
   shadow) — still a real, clearly-tappable button, just reading as a
   secondary utility affordance rather than a bold primary action, since
   for most people most of the time it has nothing to do (already
   decided). Sits in the SAME fixed bottom-right corner on wider
   viewports, but lifts clear of the app's own mobile bottom tab bar
   below 880px (matching that bar's own breakpoint in Stylesheet.html) —
   this button is a separate top-level element outside the app's iframe,
   so it has no way to know the tab bar exists short of mirroring its
   breakpoint and reserved height (80px + safe-area-inset-bottom) here. */
#notif-fab{
    position:fixed;
    right:14px;
    bottom:max(14px, env(safe-area-inset-bottom));
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid rgba(232,199,137,0.35);
    background:rgba(18,35,59,0.82);
    color:#e8c789;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.28);
    z-index:10;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:bottom .15s ease;
}
#notif-fab:active{ transform:scale(0.94); }
#notif-fab[hidden]{ display:none; }
@media (max-width: 880px) {
    #notif-fab{ bottom:calc(80px + env(safe-area-inset-bottom, 0px) + 12px + 48px); }
}
</style>
</head>
<body>
<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbwc3mG8pAowHtUseNYMzTPRWmEPq_NA0YA5GRzz8oP2TCNW6bj-NJKRnB3Bap4Qo2Q/exec"
  allow="clipboard-write; accelerometer; gyroscope; geolocation; publickey-credentials-get; publickey-credentials-create">
</iframe>
<button id="notif-fab" type="button" aria-label="Enable notifications" title="Enable notifications" hidden>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0"/></svg>
</button>
<script>
var swRegistration = null;
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .then(function (reg) { swRegistration = reg; })
        .catch(console.error);
}

/* ============================================================
   Firebase Messaging (client-safe config only — no secrets here;
   the FCM sending credential lives only in Apps Script Script
   Properties, never in this file or the repo)
   ============================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyDhlY4ddtVCfe60qI0rf7Mk53bNUoAljoo",
  authDomain: "kahorngpush.firebaseapp.com",
  projectId: "kahorngpush",
  storageBucket: "kahorngpush.firebasestorage.app",
  messagingSenderId: "332993684474",
  appId: "1:332993684474:web:fe004d1658983b5565fa43"
};
var VAPID_KEY = "BJH5Rc5AMjoV_72ENfyW_zCiv3VtdvUhlPQaZ-FA07phQScIdEQ8pz4xGh2zvrhV3UrotpanOMVoPqncuqxTikc";

var messaging = null;
try {
    firebase.initializeApp(firebaseConfig);
    messaging = firebase.messaging();
} catch (err) {
    console.error('Firebase Messaging init failed:', err);
}

/** Runs the actual permission prompt + FCM token fetch. Must happen here
 *  (the wrapper's own origin), not inside the iframed app — see the
 *  architecture notes on why. Resolves to {granted, token, previousToken,
 *  error}. `previousToken` is the last token THIS browser successfully
 *  registered, tracked in localStorage — see api_registerDevice's own
 *  comment for why this is what prevents a duplicate delivery when FCM
 *  rotates the token: it's what lets the server deactivate the old row
 *  precisely, based on this exact browser's own history, never a guess. */
var FCM_TOKEN_KEY = 'kahorng_fcm_token';
function requestNotificationPermissionAndToken() {
    if (!('Notification' in window) || !messaging) {
        return Promise.resolve({ granted: false, token: null, previousToken: null, error: 'unsupported' });
    }
    var previousToken = null;
    try { previousToken = localStorage.getItem(FCM_TOKEN_KEY); } catch (err) { /* best-effort */ }

    // On iOS, a Notification.requestPermission() call made without a
    // genuine, synchronous user gesture (e.g. the silent refresh below,
    // called automatically on load) can resolve to "denied" even though
    // the real, current OS-level permission is still "granted". When
    // permission is already "granted", Notification.permission itself is
    // the reliable, current source of truth — skip re-asking entirely and
    // go straight into the same token-fetch flow below. When it is NOT
    // already granted, this still calls Notification.requestPermission()
    // exactly as before, so the bell's explicit, real-user-gesture flow
    // (first-time grant, or an actual "denied"/"default" state) is
    // unaffected.
    var permissionPromise = (Notification.permission === 'granted')
        ? Promise.resolve('granted')
        : Notification.requestPermission();

    return permissionPromise.then(function (permission) {
        if (permission !== 'granted') return { granted: false, token: null, previousToken: previousToken, error: 'denied' };
        var regPromise = swRegistration
            ? Promise.resolve(swRegistration)
            : navigator.serviceWorker.ready.catch(function () { return null; });
        return regPromise.then(function (reg) {
            return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg || undefined })
                .then(function (token) {
                    if (!token) return { granted: false, token: null, previousToken: previousToken, error: 'no-token' };
                    try { localStorage.setItem(FCM_TOKEN_KEY, token); } catch (err) { /* best-effort — worst case a future rotation isn't caught */ }
                    return { granted: true, token: token, previousToken: previousToken, error: null };
                })
                .catch(function (err) {
                    return { granted: false, token: null, previousToken: previousToken, error: String((err && err.message) || err) };
                });
        });
    }).catch(function (err) {
        return { granted: false, token: null, previousToken: previousToken, error: String((err && err.message) || err) };
    });
}

// ---- Device-removal opt-out (Notification Pass 3) ----
// Local-only marker: "the person explicitly removed notifications on
// THIS browser, don't silently bring it back." Set only after confirming
// (via the app, which can reach the backend) that THIS browser's own
// token is no longer an active registered device — see the
// 'devices-changed'/'token-status-result' handling below. Cleared only by
// an explicit bell tap (a real, deliberate re-enable action), never by
// the silent refresh itself.
var NOTIF_OPTOUT_KEY = 'kahorng_notif_optout';
function isNotifOptedOut() {
    try { return localStorage.getItem(NOTIF_OPTOUT_KEY) === '1'; } catch (err) { return false; }
}
function setNotifOptedOut() {
    try { localStorage.setItem(NOTIF_OPTOUT_KEY, '1'); } catch (err) { /* best-effort */ }
}
function clearNotifOptedOut() {
    try { localStorage.removeItem(NOTIF_OPTOUT_KEY); } catch (err) { /* best-effort */ }
}

// The bell button itself — a real element in this top-level page, so the
// click below is a genuine user gesture and Notification.requestPermission()
// (called synchronously inside it, no intervening await) actually completes
// a real OS-level push registration on every platform, iOS included.
var notifFab = document.getElementById('notif-fab');
if (notifFab && 'Notification' in window && messaging) {
    // Only reveal for 'default' (never decided) — NOT '!== granted', which
    // used to also catch 'denied' and show the bell forever on every load
    // even though tapping it can never do anything once the browser has
    // permanently refused: Notification.requestPermission() resolves
    // immediately back to 'denied' with no prompt, per spec. The silent
    // refresh below is unaffected by this — it's already gated on
    // 'granted' and so can never run (or reveal the bell) while denied.
    if (Notification.permission === 'default') notifFab.hidden = false;
    notifFab.addEventListener('click', function () {
        notifFab.disabled = true;
        requestNotificationPermissionAndToken().then(function (result) {
            notifFab.disabled = false;
            if (result.granted && result.token) {
                notifFab.hidden = true;
                // A deliberate tap succeeding IS the explicit re-enable
                // action — always clears any prior opt-out, regardless of
                // whether one was actually set (harmless no-op if not).
                clearNotifOptedOut();
            }
            // Sent proactively (not a reply — nothing in the iframe asked for
            // this), to whichever app frame we know about; queued the same
            // way a pending navigate is if the app hasn't said "ready" yet.
            var payload = { source: 'kahorng-wrapper', type: 'notification-permission-result', granted: result.granted, token: result.token, previousToken: result.previousToken, error: result.error };
            if (appSource && appOrigin) {
                try { appSource.postMessage(payload, appOrigin); } catch (err) { /* app frame gone */ }
            } else {
                pendingNotificationResult = payload;
            }
        });
    });
}

// Foreground push (a Kahorng tab is open and focused): FCM does NOT
// auto-display these, unlike backgrounded/closed-app pushes handled by
// sw.js's onBackgroundMessage — so this is the foreground equivalent,
// same title/body/data shape, same click behavior (forward into the app).
// Reads title/body from `data`, not a top-level `notification` field — see
// buildFcmRequests' own comment (NotificationService.gs) for why the
// outgoing message is data-only.
if (messaging) {
    messaging.onMessage(function (payload) {
        if (Notification.permission !== 'granted') return;
        var data = payload.data || {};
        try {
            var notif = new Notification(data.title || 'Kahorng', {
                body: data.body || '',
                icon: 'https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png',
                data: data
            });
            notif.onclick = function () {
                window.focus();
                forwardNavigateToApp(data.view, data.entityId);
                notif.close();
            };
        } catch (err) { /* best-effort — a foreground push that fails to display is a minor miss, not a crash */ }
    });
}

// ---- Session-token bridge (see JavaScript.html: "WRAPPER BRIDGE") ----
// On iOS, a Home Screen web app runs standalone, and WebKit applies much
// stricter storage rules to the iframed app (script.google.com) in that
// context than to this page — writes from inside the iframe can silently
// fail to survive a force-quit + relaunch even though nothing ever
// throws an error. This page IS first-party from iOS's point of view and
// doesn't have that restriction, so it holds the durable copy of the
// session token instead, and hands it to the app on request.
//
// Replies go via e.source (whichever window actually sent the message),
// not appFrame.contentWindow — confirmed necessary on iOS specifically:
// Apps Script's own content sandboxing puts the app's script one frame
// level deeper than this wrapper's direct <iframe>, so
// appFrame.contentWindow only reaches that intermediate frame, not where
// the app's own code is actually running. e.source is correct regardless
// of how many levels deep it turns out to be.
var TOKEN_KEY = 'kahorng_session_token';
var appFrame = document.getElementById('app-frame');

// The app's own source/origin, captured the moment it first says "ready"
// — reused afterwards to PROACTIVELY message it (e.g. a notification tap
// arriving well after boot), not just to reply to something it sent.
var appSource = null;
var appOrigin = null;
// If a notification tap needs to navigate the app before it has said
// "ready" yet (e.g. this wrapper window was just opened), the view is
// queued here and flushed the moment appSource becomes available.
var pendingNavigateView = null;
// Same idea, for the entityId that came along with that same tap (Pass 3
// deep-linking) — always flushed together with pendingNavigateView, never
// independently.
var pendingNavigateEntityId = null;
// Same idea, for a bell-button tap that resolves before the app frame has
// said "ready" yet (e.g. the button was tapped during initial load).
var pendingNotificationResult = null;

/** Normalizes an entityId that may have crossed through FCM's data
 *  payload (string-only — see buildFcmRequests' own note server-side) or
 *  a URL hash: treats a missing value, or the literal strings 'null'/
 *  'undefined' (what a stringified null/undefined would look like),
 *  as "no entity" rather than a real id to look up. */
function normalizeEntityId(entityId) {
    if (!entityId || entityId === 'null' || entityId === 'undefined') return null;
    return entityId;
}

function forwardNavigateToApp(view, entityId) {
    if (!view) return;
    entityId = normalizeEntityId(entityId);
    var payload = { source: 'kahorng-wrapper', type: 'navigate', view: view };
    if (entityId) payload.entityId = entityId;
    if (appSource && appOrigin) {
        try { appSource.postMessage(payload, appOrigin); } catch (err) { /* app frame gone — nothing to do */ }
    } else {
        pendingNavigateView = view;
        pendingNavigateEntityId = entityId;
    }
}

// Cold start via a notification tap: sw.js opens this page at
// './#<view>' (optionally '?e=<entityId>' appended — see sw.js) when no
// Kahorng window was already open. Pick that up here as a fallback
// alongside the postMessage relay below, in case the SW's client message
// races ahead of this script's listeners being attached.
if (location.hash) {
    var coldStartHash = location.hash.slice(1);
    var coldStartEntityIdx = coldStartHash.indexOf('?e=');
    if (coldStartEntityIdx !== -1) {
        pendingNavigateView = coldStartHash.slice(0, coldStartEntityIdx);
        try { pendingNavigateEntityId = normalizeEntityId(decodeURIComponent(coldStartHash.slice(coldStartEntityIdx + 3))); }
        catch (err) { pendingNavigateEntityId = null; }
    } else {
        pendingNavigateView = coldStartHash;
    }
}

window.addEventListener('message', function (e) {
    if (e.source === window) return; // ignore our own messages
    if (!e.data || e.data.source !== 'kahorng-app') return;
    if (e.data.type === 'ready') {
        appSource = e.source;
        appOrigin = e.origin;
        var token = null;
        try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY); } catch (err) { /* nothing to hand back */ }
        e.source.postMessage({ source: 'kahorng-wrapper', type: 'token', token: token }, appOrigin);
        if (pendingNavigateView) {
            var view = pendingNavigateView;
            var entityId = pendingNavigateEntityId;
            pendingNavigateView = null;
            pendingNavigateEntityId = null;
            forwardNavigateToApp(view, entityId);
        }
        if (pendingNotificationResult) {
            var result = pendingNotificationResult;
            pendingNotificationResult = null;
            try { e.source.postMessage(result, e.origin); } catch (err) { /* app frame gone */ }
        }
    } else if (e.data.type === 'token-changed') {
        try {
            if (e.data.token) {
                // Mirrors the app's own Remember-me choice: persistent
                // storage for "remembered" logins, session-only otherwise.
                if (e.data.remember) { localStorage.setItem(TOKEN_KEY, e.data.token); sessionStorage.removeItem(TOKEN_KEY); }
                else { sessionStorage.setItem(TOKEN_KEY, e.data.token); localStorage.removeItem(TOKEN_KEY); }
            } else {
                localStorage.removeItem(TOKEN_KEY);
                sessionStorage.removeItem(TOKEN_KEY);
            }
        } catch (err) { /* first-party storage should work here, but never let this crash the wrapper */ }
    } else if (e.data.type === 'devices-changed') {
        // The app just removed a device from Settings (any device, not
        // necessarily this one — the app has no way to know which). Only
        // THIS browser can tell whether it was the one removed: silently
        // re-fetch this browser's own current token (no prompt — same
        // no-UI-when-already-decided guarantee the silent refresh below
        // relies on) and ask the app to check its live status.
        if (Notification.permission === 'granted' && messaging) {
            var regPromise2 = swRegistration ? Promise.resolve(swRegistration) : navigator.serviceWorker.ready.catch(function () { return null; });
            regPromise2.then(function (reg) {
                return messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: reg || undefined });
            }).then(function (token) {
                if (!token) return;
                var checkPayload = { source: 'kahorng-wrapper', type: 'check-token-status', token: token };
                if (appSource && appOrigin) {
                    try { appSource.postMessage(checkPayload, appOrigin); } catch (err) { /* app frame gone */ }
                }
            }).catch(function () { /* best-effort — a failed check just leaves the opt-out flag as it was */ });
        }
    } else if (e.data.type === 'token-status-result') {
        // Reply to the check above — the ONLY place the opt-out flag is
        // ever set, and it's always based on this browser's own token,
        // never inferred from which device ID was removed.
        if (e.data.active === false) setNotifOptedOut();
        else if (e.data.active === true) clearNotifOptedOut(); // defensive: correct a stale flag if this device is in fact still active
    }
});

// Relay from the service worker (a notification tap while this wrapper
// window already existed) into the app frame, via the same forwarder
// used for the cold-start hash case above.
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function (e) {
        if (!e.data || e.data.source !== 'kahorng-sw' || e.data.type !== 'navigate') return;
        forwardNavigateToApp(e.data.view, e.data.entityId);
    });
}

// ---- Silent token refresh (Notification Pass 1, reliability) ----
// If this browser already granted permission in an earlier session, keep
// the registered token/lastSeenAt fresh in the background — no prompt,
// no user gesture needed. This is safe because Notification.
// requestPermission() resolves immediately with no UI shown when
// permission is already 'granted' (per spec) — so
// requestNotificationPermissionAndToken() (the exact same function the
// bell button calls) can be called here unconditionally with no risk of
// surprising the person with a permission dialog. This is what fixes
// lastSeenAt going stale forever after a single bell tap, and what
// re-obtains a rotated FCM token before it silently starts failing.
//
// Skipped entirely when isNotifOptedOut() (Notification Pass 3) — the
// person explicitly removed notifications on this exact device, and this
// refresh existing at all is what silently undid that before this guard
// was added. Only an explicit bell tap (which always clears the flag —
// see its click handler above) can bring this device back.
//
// Marked `silent: true` so the app knows this is a routine background
// check, not a user-initiated action — it registers quietly on success
// and shows no error toast on failure. On failure, the bell button is
// revealed so the person has a real, working manual retry — the exact
// same tap-to-enable path already used for a first-time grant.
if (notifFab && 'Notification' in window && messaging && Notification.permission === 'granted' && !isNotifOptedOut()) {
    requestNotificationPermissionAndToken().then(function (result) {
        var payload = { source: 'kahorng-wrapper', type: 'notification-permission-result', granted: result.granted, token: result.token, previousToken: result.previousToken, error: result.error, silent: true };
        if (appSource && appOrigin) {
            try { appSource.postMessage(payload, appOrigin); } catch (err) { /* app frame gone */ }
        } else {
            pendingNotificationResult = payload;
        }
        if (!result.granted || !result.token) {
            notifFab.hidden = false;
        }
    });
}
</script>
</body>
</html>
