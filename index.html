<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahorng</title>
<meta name="theme-color" content="#0a1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kahorng">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/MyFQSJGQ/kahorng-icon-512-1.png">
<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0a1120;
}
iframe{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:#0a1120;
}
</style>
</head>
<body>
<iframe
  id="app-frame"
  src="https://script.google.com/macros/s/AKfycbzPzKR1wdHtV6e2XBUE-XFNxAyKP0UQbvlpaBfFBRpF9Q1ecWaP3EBrfJZB3HkK0TXv/exec"
  allow="clipboard-write">
</iframe>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(console.error);
}
// ---- Session-token bridge (see JavaScript.html: "WRAPPER BRIDGE") ----
var TOKEN_KEY = 'kahorng_session_token';
var appFrame = document.getElementById('app-frame');

// TEMPORARY DIAGNOSTIC. Replies go via e.source (whichever window actually
// sent the message) rather than appFrame.contentWindow — if Apps Script's
// own content sandboxing puts the app an extra frame level deeper than
// this wrapper's direct iframe, appFrame.contentWindow only reaches that
// first level, which may not be where the app's script is actually
// running; e.source is correct regardless of how many levels deep it is.
var lastAppSource = null; // remembers wherever we last heard from, for wdebug() before any reply has gone out yet
function wdebug(msg) {
    var target = lastAppSource || appFrame.contentWindow;
    try { target.postMessage({ source: 'kahorng-wrapper', type: 'debug', msg: msg }, '*'); } catch (err) { /* nowhere to send this yet */ }
}

window.addEventListener('message', function (e) {
    if (e.source === window) return; // ignore our own messages, avoid any possible loop
    wdebug('listener fired — data=' + JSON.stringify(e.data) + ', source===appFrame.contentWindow? ' + (e.source === appFrame.contentWindow));

    if (!e.data || e.data.source !== 'kahorng-app') return;
    lastAppSource = e.source;

    if (e.data.type === 'ready') {
        var token = null;
        try { token = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY); } catch (err) { wdebug('reading storage THREW: ' + err.message); }
        wdebug('replying to ready via e.source — token ' + (token ? 'present' : 'null'));
        e.source.postMessage({ source: 'kahorng-wrapper', type: 'token', token: token }, '*');
    } else if (e.data.type === 'token-changed') {
        try {
            if (e.data.token) {
                if (e.data.remember) { localStorage.setItem(TOKEN_KEY, e.data.token); sessionStorage.removeItem(TOKEN_KEY); }
                else { sessionStorage.setItem(TOKEN_KEY, e.data.token); localStorage.removeItem(TOKEN_KEY); }
            } else {
                localStorage.removeItem(TOKEN_KEY);
                sessionStorage.removeItem(TOKEN_KEY);
            }
            wdebug('token-changed handled, stored ' + (e.data.token ? 'present' : 'null'));
        } catch (err) { wdebug('storing token THREW: ' + err.message); }
    }
});
</script>
</body>
</html>
